  <script>
    function toggleNavbarFixed() {
      let navbar = document.querySelector(".navbar");

      if (window.innerWidth >= 992) {
        navbar.classList.add("fixed-top"); // أو sm-fixed-top
      } else {
        navbar.classList.remove("fixed-top"); // أو sm-fixed-top
      }
    }


    toggleNavbarFixed();


    window.addEventListener("resize", toggleNavbarFixed);
